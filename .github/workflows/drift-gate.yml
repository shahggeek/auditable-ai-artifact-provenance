name: drift-gate
on:
  pull_request:
    paths:
      - "artifacts/SPEC_v*.md"
jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed SPECs against drift budget
        run: |
          set -e
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "$base"...HEAD -- 'artifacts/SPEC_v*.md' | while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "$base:$f" 2>/dev/null; then
              git show "$base:$f" > /tmp/old_spec.md
              echo "== drift check: $f vs $base =="
              bash tools/drift-check.sh /tmp/old_spec.md "$f"
            else
              # ls-tree does not expand this filename wildcard; filter its listing.
              prior=$(git ls-tree -r --name-only "$base" -- artifacts/ | grep -E '^artifacts/SPEC_v[^/]+[.]md$' | sort -V | tail -1)
              if [ -z "$prior" ]; then
                echo "ERROR: $f is new and the base branch contains no prior SPEC version" >&2
                exit 1
              fi
              git show "$base:$prior" > /tmp/old_spec.md
              echo "== drift check: new $f vs latest base version $prior =="
              bash tools/drift-check.sh /tmp/old_spec.md "$f"
            fi
          done
